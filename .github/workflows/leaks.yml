name: Check for secrets leak

on:
  workflow_dispatch:
  push:
    branches: [main, release]

jobs:
  leaks:
    name: Perform gitleaks secrets leak test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
